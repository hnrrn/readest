name: Build Readest Windows App exe

on:
  push:
    branches:
      - open_ai_compat_tts 

jobs:
  # ================= Windows 构建任务 =================
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive # Readest 含有子模块依赖，需完整拉取

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./apps/readest-app/src-tauri -> target"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install Dependencies & Setup Vendors
        run: |
          pnpm install
          pnpm --filter @readest/readest-app setup-pdfjs
          pnpm tauri info
          
      - name: Build Windows App via Tauri
        run: |
          pnpm tauri build --bundles nsis
      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: readest-windows-exe
          path: apps/readest-app/src-tauri/target/release/bundle/nsis/*.exe
