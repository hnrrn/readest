name: Build Readest Windows App

on:
  workflow_dispatch: # 仅支持手动触发构建
    inputs:
      create_release:
        description: '构建完成后是否自动发布 GitHub Release？'
        required: true
        type: boolean
        default: false

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive # Readest 包含子模块依赖，需完整拉取

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # 缓存 Rust 编译产物，大幅缩短后续 Tauri 的打包时间
      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./apps/readest-app/src-tauri -> target"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      # 缓存 Next.js 编译文件，避免抛出 "No build cache found" 警告并加速前端打包
      - name: Setup Next.js Cache
        uses: actions/cache@v4
        with:
          path: apps/readest-app/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-

      # 核心修复步骤：必须指定 shell: bash
      # Windows 默认的 PowerShell 无法正确运行 Readest 内部用于搬运 PDF.js 的 sh/bash 脚本
      - name: Install Dependencies & Setup Vendors
        shell: bash
        run: |
          pnpm install
          # 释放电子书/PDF 渲染所需的静态资源至应用目录
          pnpm --filter @readest/readest-app setup-vendors || pnpm --filter @readest/readest-app setup-pdfjs

      # 构建 Tauri Windows 应用
      - name: Build Windows App via Tauri
        shell: bash
        env:
          NODE_OPTIONS: --max-old-space-size=8192 # 防止 Webpack 在构建机上内存溢出 (OOM)
        run: |
          # 明确指定打包为 msi 安装包（相较于 nsis，在 CI 环境下不依赖外部额外工具，更稳定）
          pnpm tauri build --bundles msi

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: readest-windows-msi
          path: apps/readest-app/src-tauri/target/release/bundle/msi/*.msi

  # ================= 可选任务：根据输入决定是否创建 Release =================
  create-release:
    needs: build-windows
    if: ${{ github.event.inputs.create_release == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: readest-windows-msi
          path: ./release-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./release-artifacts/**/*
          tag_name: manual-build-${{ github.run_id }}
          name: Manual Build ${{ github.run_id }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
