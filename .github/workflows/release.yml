name: Build Readest Windows App

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: '构建完成后是否自动发布 Release？'
        required: true
        type: boolean
        default: false

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./apps/readest-app/src-tauri -> target"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      # 关键修复 1：明确指定 shell: bash，让 Linux 命令在 Windows 也能正常运行
      # 关键修复 2：移除强行跳过错误的指令，如果搬运文件失败，CI 会在此处直接报错而不是留到 Next.js 打包阶段
      - name: Install Dependencies & Setup Vendors
        shell: bash
        run: |
          pnpm install
          pnpm --filter @readest/readest-app setup-vendors || pnpm --filter @readest/readest-app setup-pdfjs

      # 增加 NODE_OPTIONS 防止 Webpack 在 Windows 构件机上打包崩溃 (OOM)
      - name: Build Windows App via Tauri
        shell: bash
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: |
          pnpm tauri build --bundles msi

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: readest-windows-msi
          path: apps/readest-app/src-tauri/target/release/bundle/msi/*.msi

  create-release:
    needs: build-windows
    if: ${{ github.event.inputs.create_release == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: readest-windows-msi
          path: ./release-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./release-artifacts/**/*
          tag_name: manual-build-${{ github.run_id }}
          name: Manual Build ${{ github.run_id }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
